<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-label="Arthur Saraiva, Backend Developer. Estudante de Análise e Desenvolvimento de Sistemas na FIAP, quer trabalhar no setor bancário. Java, Spring Boot, Python, Go e PostgreSQL.">
<style>
.blk{font-family:'Arial Black','Helvetica Neue',Impact,Arial,sans-serif;font-weight:900}
.sans{font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace}
.draw{stroke-dasharray:1400 1400;animation:draw 7s ease-in-out infinite}
.m1{animation:m1 22s linear infinite}
.m2{animation:m2 26s linear infinite}
.spin{animation:spin 24s linear infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 2s ease-in-out infinite}
.bar{opacity:0;animation:bar 7.5s infinite}
.tx{animation:tx 7.5s infinite}
@keyframes draw{0%{stroke-dashoffset:1400}45%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-1400}}
@keyframes m1{to{transform:translateX(-1300px)}}
@keyframes m2{from{transform:translateX(-1300px)}to{transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dot{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes bar{0%{opacity:0}3%,17%{opacity:1}20%,100%{opacity:0}}
@keyframes tx{0%{fill:#111}3%,17%{fill:#fff}20%,100%{fill:#111}}
</style>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#000" fill-opacity=".08"/></pattern>
  <filter id="sh" x="-5%" y="-40%" width="110%" height="190%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
  <path id="circ" d="M-80 0a80 80 0 1 1 160 0a80 80 0 1 1 -160 0"/>
</defs>

<rect width="1600" height="1340" fill="#C3C4C6"/>
<rect width="1600" height="1340" fill="url(#dots)"/>

<!-- top bar -->
<circle class="dot" cx="78" cy="64" r="6" fill="#111"/>
<text class="mono" x="98" y="70" font-size="18" font-weight="700" letter-spacing="6" fill="#111">BACKEND DEVELOPER</text>
<text class="mono" x="1530" y="70" font-size="18" font-weight="700" letter-spacing="6" fill="#111" text-anchor="end">FIAP · ADS · 1º ANO</text>
<rect x="70" y="96" width="1460" height="3" fill="#111"/>

<!-- giant name -->
<text class="blk" x="66" y="316" font-size="250" fill="#111" textLength="1180" lengthAdjust="spacingAndGlyphs">ARTHUR</text>
<text class="blk draw" x="66" y="568" font-size="250" fill="#111" fill-opacity=".07" stroke="#111" stroke-width="3.5" stroke-linejoin="round" textLength="1180" lengthAdjust="spacingAndGlyphs">SARAIVA</text>

<!-- rotating badge -->
<g transform="translate(1410,250)">
  <circle r="112" fill="none" stroke="#111" stroke-width="2"/>
  <g class="spin"><text class="mono" font-size="17" font-weight="700" fill="#111"><textPath href="#circ" xlink:href="#circ" textLength="496" lengthAdjust="spacing">BACKEND • BANKING TECH • FIAP • ADS •</textPath></text></g>
  <circle r="50" fill="#111"/>
  <text class="mono" y="13" font-size="36" font-weight="800" fill="#fff" text-anchor="middle">{ }</text>
</g>

<!-- crossing marquee bands -->
<g transform="rotate(-4 800 720)" filter="url(#sh)">
  <rect x="-300" y="682" width="2200" height="76" fill="#111"/>
  <g class="m1" font-size="38" font-weight="800" fill="#E9EAEC" letter-spacing="3">
    <text class="sans" x="-200" y="734" textLength="1300" lengthAdjust="spacing">JAVA  •  SPRING BOOT  •  PYTHON  •  GO  •  POSTGRESQL  •</text>
    <text class="sans" x="1100" y="734" textLength="1300" lengthAdjust="spacing">JAVA  •  SPRING BOOT  •  PYTHON  •  GO  •  POSTGRESQL  •</text>
    <text class="sans" x="2400" y="734" textLength="1300" lengthAdjust="spacing">JAVA  •  SPRING BOOT  •  PYTHON  •  GO  •  POSTGRESQL  •</text>
  </g>
</g>
<g transform="rotate(4 800 720)" filter="url(#sh)">
  <rect x="-300" y="682" width="2200" height="76" fill="#F2F3F4"/>
  <g class="m2" font-size="38" font-weight="800" fill="#111" letter-spacing="3">
    <text class="sans" x="-200" y="734" textLength="1300" lengthAdjust="spacing">BACKEND DEVELOPER  •  SETOR BANCÁRIO  •  FIAP  •  ADS  •</text>
    <text class="sans" x="1100" y="734" textLength="1300" lengthAdjust="spacing">BACKEND DEVELOPER  •  SETOR BANCÁRIO  •  FIAP  •  ADS  •</text>
    <text class="sans" x="2400" y="734" textLength="1300" lengthAdjust="spacing">BACKEND DEVELOPER  •  SETOR BANCÁRIO  •  FIAP  •  ADS  •</text>
  </g>
</g>

<!-- columns -->
<rect x="70" y="910" width="1460" height="3" fill="#111"/>
<rect x="580" y="930" width="2" height="360" fill="#111" fill-opacity=".35"/>
<rect x="1130" y="930" width="2" height="360" fill="#111" fill-opacity=".35"/>

<g>
  <circle class="dot" cx="76" cy="962" r="5" fill="#111"/>
  <text class="mono" x="92" y="968" font-size="15" font-weight="700" letter-spacing="4" fill="#111">01 / QUEM SOU EU</text>
  <text class="blk" x="70" y="1046" font-size="54" fill="#111">Dev backend</text>
  <text class="blk" x="70" y="1104" font-size="54" fill="#fff" stroke="#111" stroke-width="1.5">em formação.</text>
  <g class="sans" font-size="20" fill="#2b2b2e">
    <text x="70" y="1158">Estudante do 1º ano de Análise e</text>
    <text x="70" y="1188">Desenvolvimento de Sistemas na FIAP.</text>
    <text x="70" y="1218">Transformo regras de negócio em APIs</text>
    <text x="70" y="1248">seguras, rápidas e confiáveis.</text>
  </g>
</g>

<g>
  <circle class="dot" cx="626" cy="962" r="5" fill="#111" style="animation-delay:-.7s"/>
  <text class="mono" x="642" y="968" font-size="15" font-weight="700" letter-spacing="4" fill="#111">02 / ONDE QUERO TRABALHAR</text>
  <text class="blk" x="620" y="1046" font-size="54" fill="#111">Setor</text>
  <text class="blk" x="620" y="1104" font-size="54" fill="#fff" stroke="#111" stroke-width="1.5">bancário.</text>
  <g class="sans" font-size="20" fill="#2b2b2e">
    <text x="620" y="1158">Onde cada transação precisa estar</text>
    <text x="620" y="1188">certa, sempre. Quero ser Software</text>
    <text x="620" y="1218">Engineer em tecnologia bancária,</text>
    <text x="620" y="1248">construindo sistemas seguros e escaláveis.</text>
  </g>
</g>

<g>
  <circle class="dot" cx="1176" cy="962" r="5" fill="#111" style="animation-delay:-1.4s"/>
  <text class="mono" x="1192" y="968" font-size="15" font-weight="700" letter-spacing="4" fill="#111">03 / LINGUAGENS</text>
  <g class="sans" font-size="32" font-weight="800">
    <rect x="1160" y="996" width="380" height="54" rx="6" fill="#111" class="bar"/>
    <text x="1176" y="1034" class="tx">Java</text>
    <rect x="1160" y="1058" width="380" height="54" rx="6" fill="#111" class="bar" style="animation-delay:1.5s"/>
    <text x="1176" y="1096" class="tx" style="animation-delay:1.5s">Spring Boot</text>
    <rect x="1160" y="1120" width="380" height="54" rx="6" fill="#111" class="bar" style="animation-delay:3s"/>
    <text x="1176" y="1158" class="tx" style="animation-delay:3s">Python</text>
    <rect x="1160" y="1182" width="380" height="54" rx="6" fill="#111" class="bar" style="animation-delay:4.5s"/>
    <text x="1176" y="1220" class="tx" style="animation-delay:4.5s">Go</text>
    <rect x="1160" y="1244" width="380" height="54" rx="6" fill="#111" class="bar" style="animation-delay:6s"/>
    <text x="1176" y="1282" class="tx" style="animation-delay:6s">PostgreSQL</text>
  </g>
  <g fill="#111" fill-opacity=".25"><rect x="1160" y="1054" width="380" height="1.5"/><rect x="1160" y="1116" width="380" height="1.5"/><rect x="1160" y="1178" width="380" height="1.5"/><rect x="1160" y="1240" width="380" height="1.5"/></g>
</g>
</svg>
